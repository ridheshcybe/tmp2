# ── AeroTwin pytest configuration ──────────────────────────────────────────────
# asyncio_mode=auto lets async tests run without per-test markers, matching the
# style the suite was written in (pytest-asyncio >= 1.0 defaults to strict mode).
[pytest]
asyncio_mode = auto
testpaths =
    backend/tests
    ml/tests
    simulator/tests
    tests
